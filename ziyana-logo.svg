<svg xmlns="http://www.w3.org/2000/svg" viewBox="185 38 390 330" role="img" aria-labelledby="logoTitle logoDescription"><style>:root { --ice:#d9fbff; --blue:#7783ff; --gold:#f4ca68; } * { box-sizing:border-box; } svg { display:block; width:100%; height:auto; overflow:visible; } .draw { fill:transparent; stroke:var(--ice); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; opacity:.96; filter:drop-shadow(0 0 5px #7783ff) drop-shadow(0 0 11px #7783ff70); animation:draw-and-glow 6.4s ease-in-out infinite; } .z-main { stroke-width:8; } .woman { fill:#d8aa45; fill-opacity:0; stroke:var(--gold); stroke-width:4.5; } .hair { stroke:var(--gold); stroke-width:3.5; } .glyph-outline,.glyph-color { font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif; font-size:47px; font-weight:700; stroke-linejoin:round; paint-order:stroke fill; } .glyph-outline tspan { fill:transparent; stroke:#d9fbff; stroke-width:1.4px; stroke-dasharray:0 180; filter:drop-shadow(0 0 4px #7783ff); animation:letter-outline 8.6s ease-in-out infinite; } .glyph-color tspan { fill:url(#letterLight); opacity:0; filter:drop-shadow(0 0 6px #7783ff) drop-shadow(0 0 13px #55d9ff80); animation:letter-color 8.6s ease-in-out infinite; } .mark .z-main:nth-child(1) { animation-delay:0s; } .mark .z-main:nth-child(2) { animation-delay:.24s; } .mark .woman { animation-delay:.52s; } .mark .hair.one { animation-delay:.9s; } .mark .hair.two { animation-delay:1.12s; } .mark .hair.three { animation-delay:1.34s; } .mark .hair.four { animation-delay:1.56s; } .word-outline tspan:nth-child(1),.word-color tspan:nth-child(1) { animation-delay:1.7s; } .word-outline tspan:nth-child(2),.word-color tspan:nth-child(2) { animation-delay:1.78s; } .word-outline tspan:nth-child(3),.word-color tspan:nth-child(3) { animation-delay:1.86s; } .word-outline tspan:nth-child(4),.word-color tspan:nth-child(4) { animation-delay:1.94s; } .word-outline tspan:nth-child(5),.word-color tspan:nth-child(5) { animation-delay:2.02s; } .word-outline tspan:nth-child(6),.word-color tspan:nth-child(6) { animation-delay:2.10s; } .word-outline tspan:nth-child(7),.word-color tspan:nth-child(7) { animation-delay:2.18s; } .word-outline tspan:nth-child(8),.word-color tspan:nth-child(8) { animation-delay:2.26s; } .word-outline tspan:nth-child(9),.word-color tspan:nth-child(9) { animation-delay:2.34s; } .word-outline tspan:nth-child(10),.word-color tspan:nth-child(10) { animation-delay:2.42s; } .word-outline tspan:nth-child(11),.word-color tspan:nth-child(11) { animation-delay:2.50s; } .word-outline tspan:nth-child(12),.word-color tspan:nth-child(12) { animation-delay:2.58s; } .word-outline tspan:nth-child(13),.word-color tspan:nth-child(13) { animation-delay:2.66s; } @keyframes draw-and-glow { 0% { stroke-dashoffset:1; fill-opacity:0; opacity:.15; } 38% { stroke-dashoffset:0; fill-opacity:0; opacity:1; } 52% { stroke-dashoffset:0; fill-opacity:.92; opacity:1; } 76% { stroke-dashoffset:0; fill-opacity:.92; opacity:1; } 96%,100% { stroke-dashoffset:0; fill-opacity:0; opacity:0; } } @keyframes letter-outline { 0%,8% { stroke-dasharray:0 180; opacity:.1; } 22% { stroke-dasharray:180 0; opacity:1; } 34%,61% { stroke-dasharray:180 0; opacity:1; } 76%,100% { stroke-dasharray:0 180; opacity:0; } } @keyframes letter-color { 0%,21% { opacity:0; } 34%,61% { opacity:1; } 76%,100% { opacity:0; } } @media(max-width:600px) { .glyph-outline,.glyph-color { font-size:42px; } } @media(prefers-reduced-motion:reduce) { .draw,.glyph-outline tspan,.glyph-color tspan { animation:none; stroke-dashoffset:0; stroke-dasharray:none; opacity:1; } .draw { fill-opacity:1; } }</style><title id="logoTitle">Ziyana Fashion</title><desc id="logoDescription">A Z monogram and a woman's profile are drawn in glowing light, followed by the Ziyana Fashion wordmark.</desc><defs><linearGradient id="letterLight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4ca68" /><stop offset=".48" stop-color="#f9f4d